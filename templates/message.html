{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-xl rounded-card border border-line bg-surface px-6 py-10 text-center">
  <h1 class="text-xl font-semibold text-ink">{{ heading }}</h1>
  <p class="mt-3 text-ink-muted">{{ text }}</p>
  <div class="mt-6 flex justify-center gap-3">
    <a href="/" class="rounded-lg border border-line px-3 py-1.5 text-sm font-medium text-ink-muted hover:border-line-strong hover:text-ink">Accueil</a>
    {% if let Some((href, label)) = action %}
    <a href="{{ href }}" class="rounded-lg bg-accent px-3 py-1.5 text-sm font-medium text-on-accent hover:bg-accent/90">{{ label }}</a>
    {% endif %}
  </div>
</div>
{% endblock %}
