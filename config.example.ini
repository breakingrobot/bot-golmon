# Configuration du module ticket — même format que Dragory/modmailbot.
# Copier en config.ini (ou utiliser les variables d'environnement MM_*).
# Toutes les options de modmailbot sont reconnues : voir README.md.
# Le token du bot vient de DISCORD_TOKEN ; l'option `token` est ignorée.

# Requis
mainServerId = REPLACE_WITH_MAIN_SERVER_ID
inboxServerId = REPLACE_WITH_INBOX_SERVER_ID
logChannelId = REPLACE_WITH_LOG_CHANNEL_ID

# Courant
prefix = !
inboxServerPermission = manageMessages
status = Message me for help!
responseMessage = Thank you for your message! Our mod team will reply to you here as soon as possible.

# Ajouter les autres options ci-dessous :
