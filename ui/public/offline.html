<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: #f8f9fc;
        color: #1f2330;
        padding: 16px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #16181f;
          color: #eceef3;
        }
      }
      img {
        width: 56px;
        height: 56px;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 20px;
        border-radius: 8px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Pas de connexion</h1>
      <p>Le site du bot a besoin d'internet. Réessaie dès que le réseau revient.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
